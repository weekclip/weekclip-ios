name: branch-policy

# `dev` → `main` PR을 차단한다.
#
# `dev`는 통합 테스트용 **버리는 브랜치**이고 상용으로 승격되지 않는다.
# 상용에 도달하는 경로는 피처 브랜치 → `main` 하나뿐이다.
#
# 배경: 이 브랜치는 2026-08-15까지 `develop`이었다. Git Flow의 예약어라 사람도
# 에이전트도 "main으로 승격되는 통합 브랜치"로 읽었고, 그 결과 develop→main PR이
# 반복되며 develop이 사실상 트렁크가 되고 main이 벌크 덤프를 받는 구조로 뒤집혔다
# (api #108·#115, web #188·#196~199 — 이 PR들이 5~6건의 변경을 main 대조 리뷰
# 없이 한 번에 상용으로 부었다).
#
# ⚠️ 이 체크는 머지를 **물리적으로 막지 못한다.** private + free 플랜이라 branch
# protection API가 403(Upgrade to GitHub Pro)으로 막힌다. 빨간 X로 드러내는 것이
# 현재 가능한 최대치다.
#
# 규칙 전문: 슈퍼레포 `CLAUDE.md` → "Branch policy".

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  no-dev-to-main:
    if: github.head_ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Reject dev → main
        run: |
          echo "::error title=dev → main PR 금지::'dev'는 버리는 통합 테스트 브랜치이고 상용으로 승격되지 않습니다. 이 PR을 닫고, 각 변경을 원래 피처 브랜치에서 main으로 직접 PR하세요. 규칙: 슈퍼레포 CLAUDE.md 'Branch policy'"
          exit 1
