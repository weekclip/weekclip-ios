name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Swift
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: 5.9

    - name: Build
      run: swift build

    - name: Run tests
      run: swift test

  lint:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Swift
      uses: swift-actions/setup-swift@v1
      with:
        swift-version: 5.9

    - name: Check formatting
      run: swift format --lint Sources Tests

    - name: Lint
      run: swiftlint lint Sources Tests || true
