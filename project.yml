name: Weekclip

options:
  bundleIdPrefix: com.weekclip
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# The SwiftPM package in this same directory (Package.swift) supplies the
# Shared / Domain / Data / Presentation modules. The app target below is a thin
# shell that only owns App/ and links the Presentation product.
packages:
  Weekclip:
    path: .

targets:
  Weekclip:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: Weekclip
        product: WeekclipPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weekclip.ios
        PRODUCT_NAME: WeekClip
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM in your shell before `xcodegen generate`, or pick
        # the team in Xcode's Signing & Capabilities tab after generating.
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

schemes:
  Weekclip:
    build:
      targets:
        Weekclip: all
    run:
      config: Debug
    archive:
      config: Release
